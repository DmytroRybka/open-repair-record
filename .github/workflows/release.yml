name: Release the self-hosted editor

# On a version tag (v1.0.0): test, then publish the self-hosted copy as
#   - a Docker image ghcr.io/dmytrorybka/open-repair-record-editor:{1.0.0, 1.0, latest} for amd64 and arm64;
#   - a zip of static files with its SHA-256, attached to a GitHub release.
# The tag must match the version in package.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: The tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - run: npm ci
      - run: npm test
      - name: The self-hosted copy makes no outside requests and works under its CSP
        run: npx playwright test -c playwright.onprem.config.ts

      - name: Package the static files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm run build:onprem
          (cd dist && zip -qr "../open-repair-record-onprem-${VERSION}.zip" .)
          sha256sum "open-repair-record-onprem-${VERSION}.zip" > "open-repair-record-onprem-${VERSION}.zip.sha256"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dmytrorybka/open-repair-record-editor
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: GitHub release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "open-repair-record-onprem-${VERSION}.zip" "open-repair-record-onprem-${VERSION}.zip.sha256" \
            --title "Open Repair Record ${VERSION}" --notes-file "release-notes/${VERSION}.md"
